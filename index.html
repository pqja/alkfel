<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E7C66">
<title>الكافل</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --emerald:#0E9F6E;
  --emerald-dark:#0B7A56;
  --azure:#2463EB;
  --azure-dark:#1746A2;
  --ink:#0B1622;
  --danger:#E23E45;
  --gold:#E8A33D;

  --bg:#F3F6F5;
  --surface:#FFFFFF;
  --surface-2:#F0F3F2;
  --text:#101C18;
  --text-dim:#5B6B66;
  --border:#E4E9E7;
  --shadow: 0 10px 30px rgba(14,40,32,.08);
  --radius:18px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"]{
  --bg:#0A1210;
  --surface:#111B18;
  --surface-2:#16211D;
  --text:#EAF3EF;
  --text-dim:#93A6A0;
  --border:#213029;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{
  height:100%;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
body{
  font-family:'Tajawal',sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-user-select:none;
  -moz-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  touch-action:pan-y;
  overflow-x:hidden;
  transition:background .25s ease, color .25s ease;
}
h1,h2,h3,.headline{font-family:'Cairo',sans-serif;}
input,textarea{
  -webkit-user-select:text;
  user-select:text;
}
img{-webkit-user-drag:none; user-drag:none; pointer-events:none;}
button, a, .tap{cursor:pointer;}
::-webkit-scrollbar{width:0; height:0;}

/* Desktop / tablet frame so it always feels like an app, never a website */
#stage{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:stretch;
  justify-content:center;
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(14,159,110,.10), transparent 60%),
    radial-gradient(1000px 500px at 100% 110%, rgba(36,99,235,.10), transparent 60%),
    var(--bg);
}
#phone{
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow:none;
}
@media (min-width:640px){
  #stage{padding:28px 12px;}
  #phone{
    max-width:430px;
    min-height:min(920px, 96vh);
    border-radius:36px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.28), 0 0 0 10px var(--surface);
    border:1px solid var(--border);
  }
}

/* ===== Splash ===== */
#splash{
  position:fixed; inset:0; z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  background:linear-gradient(160deg, var(--emerald-dark), var(--azure-dark) 130%);
  color:#fff;
}
#splash .logo-wrap{
  width:112px; height:112px; border-radius:32px;
  background:rgba(255,255,255,.12);
  display:flex; align-items:center; justify-content:center;
  animation: pop-in .9s cubic-bezier(.2,1.4,.4,1) forwards;
  backdrop-filter:blur(6px);
}
#splash svg{width:64px; height:64px; opacity:0; animation: fade-in .6s ease .35s forwards;}
#splash .brand{
  font-family:'Cairo',sans-serif; font-weight:900; font-size:26px; letter-spacing:.5px;
  opacity:0; animation: rise-in .7s ease .55s forwards;
}
#splash .tag{
  font-size:12.5px; color:rgba(255,255,255,.75); opacity:0;
  animation: rise-in .7s ease .75s forwards;
}
#splash .ring{
  position:absolute; width:190px; height:190px; border-radius:50%;
  border:2px solid rgba(255,255,255,.18);
  animation: ring-grow 1.8s ease-out infinite;
}
@keyframes pop-in{0%{transform:scale(.4) rotate(-8deg); opacity:0;}60%{transform:scale(1.06) rotate(2deg); opacity:1;}100%{transform:scale(1) rotate(0);}}
@keyframes fade-in{to{opacity:1;}}
@keyframes rise-in{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:translateY(0);}}
@keyframes ring-grow{0%{transform:scale(.8); opacity:.6;}100%{transform:scale(1.5); opacity:0;}}

/* ===== Layout ===== */
#screen{flex:1; display:flex; flex-direction:column; min-height:0;}
.page{display:flex; flex-direction:column; flex:1; min-height:0; animation:page-in .28s ease;}
@keyframes page-in{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:translateY(0);}}
.scroll{flex:1; overflow-y:auto; padding-bottom:110px; -webkit-overflow-scrolling:touch;}
.scroll.no-tabbar{padding-bottom:28px;}

/* top bar for sub-pages */
.topbar{
  display:flex; align-items:center; gap:12px;
  padding:calc(16px + var(--safe-top)) 18px 14px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20;
}
.topbar .back{
  width:38px; height:38px; border-radius:12px; background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; flex:none; border:none;
}
.topbar .back svg{width:18px; height:18px;}
.topbar h2{font-size:17px; font-weight:800;}

/* home header */
.home-header{
  padding:calc(18px + var(--safe-top)) 18px 6px;
  display:flex; align-items:center; justify-content:space-between;
}
.brand-mark{display:flex; align-items:center; gap:8px;}
.brand-mark .mark{width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--emerald),var(--azure)); display:flex; align-items:center; justify-content:center;}
.brand-mark .mark svg{width:17px; height:17px;}
.brand-mark span{font-family:'Cairo',sans-serif; font-weight:900; font-size:19px;}
.bell{position:relative; width:40px; height:40px; border-radius:12px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;}
.bell svg{width:19px; height:19px;}
.bell .dot{position:absolute; top:8px; left:9px; width:9px; height:9px; border-radius:50%; background:var(--danger); border:2px solid var(--bg);}

/* balance card */
.balance-card{
  margin:14px 18px 0; padding:22px 20px 20px;
  border-radius:22px; color:#fff; position:relative; overflow:hidden;
  background:linear-gradient(125deg,#0E9F6E 0%, #17A98A 38%, #1C86B0 72%, #2463EB 100%);
  box-shadow:0 16px 34px rgba(14,80,90,.28);
}
.balance-card::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(220px 120px at 90% -20%, rgba(255,255,255,.25), transparent 60%);
}
.balance-card .label{font-size:13px; opacity:.92; position:relative;}
.balance-card .amount{font-family:'Cairo',sans-serif; font-weight:900; font-size:32px; margin-top:8px; position:relative; direction:ltr; text-align:right;}
.balance-card .amount .cur{font-size:15px; font-weight:700; margin-inline-start:6px;}

.quick-actions{display:flex; gap:10px; padding:14px 18px 6px;}
.qa-btn{
  flex:1; background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:14px 6px; display:flex; flex-direction:column; align-items:center; gap:8px;
  font-size:12.5px; font-weight:700; color:var(--text); text-align:center;
}
.qa-btn .ic{width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center;}
.qa-btn .ic svg{width:20px; height:20px;}
.qa1 .ic{background:rgba(14,159,110,.14); color:var(--emerald);}
.qa2 .ic{background:rgba(36,99,235,.14); color:var(--azure);}
.qa3 .ic{background:rgba(232,163,61,.16); color:var(--gold);}

/* section title */
.section-title{display:flex; align-items:center; justify-content:space-between; padding:20px 18px 10px;}
.section-title h3{font-size:15.5px; font-weight:800;}

/* campaigns grid (home) */
.camp-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:0 18px;}
.camp-card{display:flex; flex-direction:column; align-items:center; gap:8px;}
.camp-card .img{width:100%; aspect-ratio:1/1; border-radius:16px; background:var(--surface-2); overflow:hidden; border:1px solid var(--border);}
.camp-card .img img{width:100%; height:100%; object-fit:cover;}
.camp-card .name{font-size:11.5px; font-weight:700; text-align:center; line-height:1.3;}
.empty-hint{padding:16px 18px; color:var(--text-dim); font-size:13px; text-align:center;}

/* bottom tab bar */
.tabbar{
  position:fixed; bottom:0; right:0; left:0; max-width:480px; margin:0 auto;
  background:var(--surface); border-top:1px solid var(--border);
  display:flex; padding:8px 6px calc(8px + var(--safe-bottom));
  z-index:30;
}
@media (min-width:640px){ .tabbar{position:absolute;} }
.tab-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:6px 2px; border:none; background:none; color:var(--text-dim); font-size:11px; font-weight:700;
}
.tab-item svg{width:21px; height:21px;}
.tab-item.active{color:var(--emerald);}

/* generic list rows */
.list{padding:0 18px;}
.row-card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:14px 16px; display:flex; align-items:center; gap:12px; margin-bottom:10px;
}
.row-card .row-ic{width:40px; height:40px; border-radius:12px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex:none;}
.row-card .row-ic svg{width:19px; height:19px;}
.row-card .row-txt{flex:1; min-width:0;}
.row-card .row-txt b{font-size:14.5px; display:block;}
.row-card .row-txt small{color:var(--text-dim); font-size:12px;}
.row-card .chev{width:18px; height:18px; color:var(--text-dim); flex:none;}
.badge-dot{width:9px; height:9px; border-radius:50%; background:var(--danger); flex:none;}

/* buttons */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:15px 16px; border-radius:15px; border:none;
  font-family:'Tajawal',sans-serif; font-weight:800; font-size:14.5px;
  background:var(--emerald); color:#fff;
}
.btn.secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
.btn.outline{background:transparent; color:var(--emerald); border:1.5px solid var(--emerald);}
.btn.danger{background:var(--danger);}
.btn:disabled{opacity:.55;}
.btn-google{background:#fff; color:#1f1f1f; border:1px solid var(--border);}
.btn-google svg{width:19px; height:19px;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:7px;}
.field input, .field textarea, .field select{
  width:100%; padding:14px 15px; border-radius:13px; border:1.5px solid var(--border);
  background:var(--surface); color:var(--text); font-family:'Tajawal',sans-serif; font-size:14.5px;
}
.field textarea{resize:vertical; min-height:110px;}
.field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--emerald);}
.hint{font-size:11.5px; color:var(--text-dim); margin-top:6px;}

.pay-option{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 16px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface);
  margin-bottom:10px;
}
.pay-option b{font-size:14.5px;}
.radio-dot{width:20px; height:20px; border-radius:50%; border:2px solid var(--border); position:relative; flex:none;}
.pay-option.selected{border-color:var(--emerald);}
.pay-option.selected .radio-dot{border-color:var(--emerald);}
.pay-option.selected .radio-dot::after{content:""; position:absolute; inset:3px; border-radius:50%; background:var(--emerald);}

.copy-box{
  background:var(--surface); border:1.5px dashed var(--emerald); border-radius:16px;
  padding:18px; text-align:center; margin-bottom:14px;
}
.copy-box .num{font-family:'Cairo',sans-serif; font-weight:900; font-size:22px; direction:ltr;}
.copy-box small{display:block; color:var(--text-dim); margin-top:6px; font-size:12px;}

.upload-box{
  border:1.5px dashed var(--border); border-radius:16px; padding:22px 16px;
  display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
  background:var(--surface-2); margin-bottom:16px; position:relative; overflow:hidden;
}
.upload-box.filled{border-color:var(--emerald); background:transparent; padding:0;}
.upload-box.filled img{width:100%; max-height:260px; object-fit:contain; border-radius:16px;}
.upload-box .up-ic{width:52px; height:52px; border-radius:16px; background:rgba(14,159,110,.12); display:flex; align-items:center; justify-content:center; color:var(--emerald);}
.upload-box input[type=file]{position:absolute; inset:0; opacity:0;}
.remove-shot{position:absolute; top:8px; left:8px; background:rgba(0,0,0,.55); color:#fff; border:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;}

/* progress campaign row */
.camp-row{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; display:flex; gap:12px; margin-bottom:12px;}
.camp-row .img{width:64px; height:64px; border-radius:13px; object-fit:cover; flex:none; background:var(--surface-2);}
.camp-row .body{flex:1; min-width:0;}
.camp-row .body b{font-size:14px;}
.progress-track{height:8px; border-radius:6px; background:var(--surface-2); margin-top:9px; overflow:hidden;}
.progress-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--emerald),var(--azure)); transition:width .5s ease;}
.progress-meta{display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-top:6px;}

/* segmented auth */
.auth-hero{padding:8px 24px 0; text-align:center; margin-top:6vh;}
.auth-hero .mark{width:78px; height:78px; border-radius:24px; margin:0 auto 16px; background:linear-gradient(135deg,var(--emerald),var(--azure)); display:flex; align-items:center; justify-content:center;}
.auth-hero .mark svg{width:40px; height:40px;}
.auth-hero h1{font-size:23px; font-weight:900;}
.auth-hero p{color:var(--text-dim); font-size:13.5px; margin-top:8px;}
.auth-actions{padding:34px 22px 24px; display:flex; flex-direction:column; gap:12px; margin-top:auto;}

.form-wrap{padding:20px 20px 30px;}

/* toast + modal */
#toast{
  position:fixed; bottom:26px; right:50%; transform:translateX(50%);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:12px; font-size:13.5px;
  z-index:9998; opacity:0; pointer-events:none; transition:opacity .25s, bottom .25s; max-width:88%; text-align:center;
}
#toast.show{opacity:1; bottom:40px;}
.modal-back{position:fixed; inset:0; background:rgba(6,12,10,.55); z-index:500; display:flex; align-items:center; justify-content:center; padding:30px;}
.modal-box{background:var(--surface); border-radius:20px; padding:26px 22px; width:100%; max-width:340px; text-align:center;}
.modal-box .ic{width:56px; height:56px; border-radius:16px; background:rgba(14,159,110,.14); color:var(--emerald); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
.modal-box h3{font-size:16px; font-weight:800; margin-bottom:8px;}
.modal-box p{font-size:13.5px; color:var(--text-dim); margin-bottom:18px; line-height:1.6;}
.sheet-back{position:fixed; inset:0; background:rgba(6,12,10,.5); z-index:500; display:flex; align-items:flex-end; justify-content:center;}
.sheet-back .frame{width:100%; max-width:480px;}
.sheet{background:var(--surface); border-radius:20px 20px 0 0; padding:10px 10px calc(16px + var(--safe-bottom)); animation:sheet-up .25s ease;}
@keyframes sheet-up{from{transform:translateY(30px); opacity:0;}to{transform:translateY(0); opacity:1;}}
.sheet .grabber{width:38px; height:4px; background:var(--border); border-radius:3px; margin:6px auto 12px;}
.sheet-item{display:flex; align-items:center; gap:12px; padding:14px 14px; border-radius:14px; font-weight:700; font-size:14px;}
.sheet-item svg{width:19px; height:19px;}
.sheet-item.danger{color:var(--danger);}

.lang-opt, .theme-row{display:flex; align-items:center; justify-content:space-between; padding:15px 16px; border:1.5px solid var(--border); border-radius:14px; margin-bottom:10px; background:var(--surface);}
.lang-opt.active{border-color:var(--emerald);}
.check-mark{width:20px; height:20px; color:var(--emerald);}
.switch{width:46px; height:26px; border-radius:20px; background:var(--surface-2); border:1.5px solid var(--border); position:relative; flex:none;}
.switch .knob{position:absolute; top:2px; right:2px; width:19px; height:19px; border-radius:50%; background:var(--text-dim); transition:.2s;}
.switch.on{background:var(--emerald); border-color:var(--emerald);}
.switch.on .knob{background:#fff; transform:translateX(-20px);}

.donor-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:12px;}
.donor-card img{width:100%; border-radius:12px; max-height:220px; object-fit:cover; margin-bottom:12px; background:var(--surface-2);}
.donor-card .kv{display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px dashed var(--border);}
.donor-card .kv:last-of-type{border-bottom:none;}
.donor-card .kv span:first-child{color:var(--text-dim);}
.two-btn{display:flex; gap:10px; margin-top:14px;}

.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:20px 18px;}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:18px 10px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;}
.tile .ic{width:48px; height:48px; border-radius:14px; background:rgba(14,159,110,.12); color:var(--emerald); display:flex; align-items:center; justify-content:center;}
.tile b{font-size:12.5px;}

.center-msg{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:40px 24px; text-align:center; color:var(--text-dim);}
.center-msg svg{width:50px; height:50px; opacity:.6;}
.spinner{width:30px; height:30px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--emerald); animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="stage">
  <div id="phone">
    <div id="splash">
      <div class="ring"></div>
      <div class="logo-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M12 21s-7.5-4.9-10-9.3C.4 8.1 2 4.5 5.6 3.7 8 3.1 10.3 4.2 12 6.4 13.7 4.2 16 3.1 18.4 3.7 22 4.5 23.6 8.1 22 11.7 19.5 16.1 12 21 12 21z"/></svg>
      </div>
      <div class="brand">الكافل</div>
      <div class="tag">معًا نصنع فرقًا حقيقيًا</div>
    </div>
    <div id="screen"></div>
  </div>
</div>

<div id="toast"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
